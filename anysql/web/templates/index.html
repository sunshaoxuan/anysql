{% extends "layout.html" %}

{% block content %}
<div class="workbench-container">
    <div class="assistant-shell">
        <section class="assistant-panel">
            <div class="assistant-head">
                <div>
                    <div class="badge badge-blue">SQL Assistant</div>
                    <h1>AnySQL Intelligence</h1>
                    <p>SQLに限定した検索・生成・修正ワークベンチ。</p>
                </div>
                <select id="productSelect" class="product-select">
                    {% for id, product in products.items() %}
                    <option value="{{ id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="chatLog" class="chat-log">
                <div class="chat-message assistant">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                        条件を入力してください。高一致のSQLがあれば再利用し、足りなければMetadataから作成して知識化します。
                    </div>
                </div>
            </div>

            <form id="assistantForm" class="assistant-input">
                <textarea id="messageInput" rows="4" placeholder="例: 2026年1月以降に異動した職員を所属順に取得したい"></textarea>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> 送信
                </button>
            </form>
        </section>

        <section class="sql-workspace">
            <div class="sql-toolbar">
                <div>
                    <div class="side-label">現在のSQL</div>
                    <div id="currentSqlMeta" class="side-muted">まだSQLは選択されていません。</div>
                </div>
                <div class="sql-actions">
                    <label class="comment-toggle">
                        <input type="checkbox" id="includeComments" checked>
                        <span>注釈を含める</span>
                    </label>
                    <button type="button" class="btn btn-outline" onclick="copyCurrentSql(this)">
                        <i class="far fa-copy"></i> Copy
                    </button>
                    <button type="button" class="btn btn-outline" onclick="resetCurrentSql()">新規相談</button>
                    <a id="detailLink" class="btn btn-outline disabled-link" href="#" aria-disabled="true">詳細</a>
                </div>
            </div>

            <div class="sql-stage">
                <pre id="currentSql" class="sql-code empty">SQL will appear here.</pre>
            </div>

            <div class="match-panel">
                <div class="side-label">マッチ判定</div>
                <div id="matchList" class="match-list"></div>
            </div>
        </section>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentSqlId = null;
let currentSql = null;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

const SQL_KEYWORDS = new Set([
    'SELECT','FROM','WHERE','JOIN','INNER','LEFT','RIGHT','FULL','OUTER','ON','AND','OR','NOT','IN','EXISTS',
    'GROUP','BY','ORDER','HAVING','UNION','ALL','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE',
    'ALTER','DROP','MERGE','CASE','WHEN','THEN','ELSE','END','AS','DISTINCT','BETWEEN','LIKE','IS','NULL',
    'TO_DATE','NVL','COALESCE','COUNT','SUM','MIN','MAX','AVG','OVER','PARTITION'
]);

const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
}[ch]));

function stripSqlComments(sql) {
    return String(sql || '')
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .split('\n')
        .map(line => line.replace(/--.*$/g, '').trimEnd())
        .filter(line => line.trim().length > 0)
        .join('\n');
}

function formatSql(sql) {
    let text = String(sql || '').replace(/\s+/g, ' ').trim();
    if (!text) return '';
    const clauses = [
        'SELECT', 'FROM', 'WHERE', 'GROUP BY', 'HAVING', 'ORDER BY',
        'INNER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'FULL JOIN', 'JOIN',
        'UNION ALL', 'UNION', 'VALUES', 'SET'
    ];
    clauses.forEach(clause => {
        const pattern = new RegExp(`\\s+(${clause.replace(' ', '\\s+')})\\s+`, 'ig');
        text = text.replace(pattern, `\n$1 `);
    });
    text = text
        .replace(/\s+(AND|OR)\s+/ig, '\n  $1 ')
        .replace(/,\s*/g, ',\n  ')
        .replace(/^\n+/, '');
    return text;
}

function highlightSql(sql) {
    const formatted = formatSql(sql);
    const escaped = escapeHtml(formatted);
    return escaped.replace(/('[^']*'|:[A-Za-z_][\w]*|\b[A-Za-z_][\w$#]*\b|\b\d+(?:\.\d+)?\b|[(),.;=*<>+-])/g, token => {
        const upper = token.toUpperCase();
        if (token.startsWith("'")) return `<span class="sql-string">${token}</span>`;
        if (token.startsWith(':')) return `<span class="sql-param">${token}</span>`;
        if (/^\d/.test(token)) return `<span class="sql-number">${token}</span>`;
        if (SQL_KEYWORDS.has(upper)) return `<span class="sql-keyword">${upper}</span>`;
        if (/^[(),.;=*<>+-]$/.test(token)) return `<span class="sql-symbol">${token}</span>`;
        return `<span class="sql-ident">${token}</span>`;
    });
}

function visibleSql() {
    const include = document.getElementById('includeComments').checked;
    return include ? currentSql || '' : stripSqlComments(currentSql || '');
}

function renderSql() {
    const el = document.getElementById('currentSql');
    const sql = visibleSql();
    if (!sql) {
        el.className = 'sql-code empty';
        el.textContent = 'SQL will appear here.';
        return;
    }
    el.className = 'sql-code';
    el.innerHTML = highlightSql(sql);
}

function addMessage(role, html) {
    const log = document.getElementById('chatLog');
    const row = document.createElement('div');
    row.className = `chat-message ${role}`;
    row.innerHTML = `
        <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
        <div class="bubble">${html}</div>
    `;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
}

function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> Copied';
        setTimeout(() => btn.innerHTML = original, 1600);
    });
}

function copyCurrentSql(btn) {
    copyToClipboard(visibleSql(), btn);
}

function renderMatches(matches) {
    const el = document.getElementById('matchList');
    if (!matches || matches.length === 0) {
        el.innerHTML = '<div class="side-muted">候補なし</div>';
        return;
    }
    el.innerHTML = matches.slice(0, 6).map(m => `
        <div class="match-row">
            <div>${escapeHtml(m.sql_id)}</div>
            <strong>${Math.round((m.llm_score || 0) * 100)}%</strong>
            <small>${escapeHtml(m.reason || '')}</small>
        </div>
    `).join('');
}

function renderRecord(response) {
    const record = response.record;
    const analysis = record.analysis || {};
    const stmt = record.statement || {};
    currentSqlId = stmt.id;
    currentSql = stmt.raw_sql || '';

    document.getElementById('currentSqlMeta').innerText = `${response.mode.toUpperCase()} / ${stmt.id || ''}`;
    const detail = document.getElementById('detailLink');
    detail.href = `/sql/${encodeURIComponent(stmt.id)}`;
    detail.classList.remove('disabled-link');
    detail.removeAttribute('aria-disabled');
    renderSql();
    renderMatches(response.matches || []);

    const learnedBadge = response.learned
        ? '<span class="badge badge-green">Learned</span>'
        : '<span class="badge badge-blue">Matched</span>';
    addMessage('assistant', `
        <div class="result-head">
            ${learnedBadge}
            <span>${escapeHtml(response.message)}</span>
        </div>
        <h3>${escapeHtml(analysis.summary || 'SQL')}</h3>
        <p>${escapeHtml((analysis.business_context || []).join(' / '))}</p>
    `);
}

async function sendMessage(text) {
    const product = document.getElementById('productSelect').value;
    addMessage('user', escapeHtml(text));
    addMessage('assistant', '<i class="fas fa-spinner fa-spin"></i> 判定中...');

    const log = document.getElementById('chatLog');
    const pending = log.lastElementChild;

    const payload = {
        product,
        message: text,
        session_id: sessionId,
        current_sql_id: currentSqlId,
        current_sql: currentSql,
        top_k: 5,
        match_threshold: 0.78
    };

    const res = await fetch('/api/assistant/sql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok) {
        addMessage('assistant', `<span style="color:#dc2626;">${escapeHtml(data.detail || 'エラーが発生しました。')}</span>`);
        return;
    }
    renderRecord(data);
}

document.getElementById('assistantForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await sendMessage(text);
});

document.getElementById('productSelect').addEventListener('change', () => {
    resetCurrentSql();
});

document.getElementById('includeComments').addEventListener('change', renderSql);

function resetCurrentSql() {
    currentSqlId = null;
    currentSql = null;
    document.getElementById('currentSqlMeta').innerText = 'まだSQLは選択されていません。';
    document.getElementById('matchList').innerHTML = '';
    const detail = document.getElementById('detailLink');
    detail.href = '#';
    detail.classList.add('disabled-link');
    detail.setAttribute('aria-disabled', 'true');
    renderSql();
}
</script>
{% endblock %}
