{% extends "layout.html" %}

{% block content %}
<div class="workbench-container">
    <div class="assistant-shell">
        <section class="assistant-panel">
            <div id="chatLog" class="chat-log">
                <div class="chat-message assistant">
                    <div class="avatar">AI</div>
                    <div class="bubble">
                        <span data-i18n="welcome">条件を入力してください。高一致のSQLがあれば再利用し、足りなければMetadataから作成して知識化します。</span>
                    </div>
                </div>
            </div>

            <form id="assistantForm" class="assistant-input">
                <label class="input-label" for="productSelect" data-i18n="product">プロダクト</label>
                <select id="productSelect" class="product-select">
                    {% for id, product in products.items() %}
                    <option value="{{ id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
                <div class="request-options">
                    <label class="comment-toggle">
                        <input type="checkbox" id="useAliases">
                        <span data-i18n="useAliases">別名を使う</span>
                    </label>
                </div>
                <textarea id="messageInput" rows="4" data-i18n-placeholder="placeholder" placeholder="例: 2026年1月以降に異動した職員を所属順に取得したい"></textarea>
                <button type="submit" class="btn btn-primary icon-btn send-btn" data-i18n-title="send" title="送信">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </section>

        <section class="sql-workspace">
            <div class="sql-toolbar">
                <div>
                    <div class="side-label" data-i18n="currentSql">現在のSQL</div>
                    <div id="currentSqlMeta" class="side-muted" data-empty="true">まだSQLは選択されていません。</div>
                </div>
                <div class="sql-actions">
                    <label class="comment-toggle">
                        <input type="checkbox" id="includeComments" checked>
                        <span data-i18n="includeComments">注釈を含める</span>
                    </label>
                    <button type="button" class="btn btn-outline icon-btn" onclick="copyCurrentSql(this)" title="Copy">
                        <i class="far fa-copy"></i>
                    </button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="resetCurrentSql()" data-i18n-title="newChat" title="新規相談"><i class="fas fa-plus"></i></button>
                    <a id="detailLink" class="btn btn-outline icon-btn disabled-link" href="#" aria-disabled="true" data-i18n-title="detail" title="詳細"><i class="fas fa-arrow-up-right-from-square"></i></a>
                </div>
            </div>

            <div class="sql-stage">
                <pre id="currentSql" class="sql-code empty">SQL will appear here.</pre>
            </div>

            <div class="match-panel">
                <div class="match-head">
                    <div class="side-label" data-i18n="match">マッチ判定</div>
                    <div id="thinkingTimer" class="thinking-timer" hidden>00:00</div>
                </div>
                <div id="matchList" class="match-list"></div>
            </div>
        </section>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentSqlId = null;
let currentSql = null;
let currentResponse = null;
let lastRequirement = "";
let thinkingTimerId = null;
let thinkingStartedAt = null;
const sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());

const SQL_KEYWORDS = new Set([
    'SELECT','FROM','WHERE','JOIN','INNER','LEFT','RIGHT','FULL','OUTER','ON','AND','OR','NOT','IN','EXISTS',
    'GROUP','BY','ORDER','HAVING','UNION','ALL','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE',
    'ALTER','DROP','MERGE','CASE','WHEN','THEN','ELSE','END','AS','DISTINCT','BETWEEN','LIKE','IS','NULL',
    'TO_DATE','NVL','COALESCE','COUNT','SUM','MIN','MAX','AVG','OVER','PARTITION'
]);

function stripSqlComments(sql) {
    return decodeHtmlEntities(String(sql || ''))
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .split('\n')
        .map(line => line.replace(/--.*$/g, '').trimEnd())
        .filter(line => line.trim().length > 0)
        .join('\n');
}

function decodeHtmlEntities(text) {
    const textarea = document.createElement('textarea');
    let value = String(text || '');
    for (let i = 0; i < 3; i += 1) {
        textarea.innerHTML = value;
        if (textarea.value === value) break;
        value = textarea.value;
    }
    return value;
}

function formatSql(sql) {
    let text = decodeHtmlEntities(String(sql || '')).replace(/\\n/g, '\n').replace(/\\'/g, "'").replace(/\\"/g, '"');
    const lines = text.split(/\r?\n/);
    const comments = [];
    while (lines.length > 0 && lines[0].trim().startsWith('--')) {
        comments.push(lines.shift().trimEnd());
    }
    text = lines.join('\n').replace(/\s+/g, ' ').trim();
    if (!text) return '';
    const clauses = [
        'SELECT', 'FROM', 'WHERE', 'GROUP BY', 'HAVING', 'ORDER BY',
        'INNER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'FULL JOIN', 'JOIN',
        'UNION ALL', 'UNION', 'VALUES', 'SET'
    ];
    clauses.forEach(clause => {
        const pattern = new RegExp(`\\s+(${clause.replace(' ', '\\s+')})\\s+`, 'ig');
        text = text.replace(pattern, `\n$1 `);
    });
    text = text
        .replace(/\s+(AND|OR)\s+/ig, '\n  $1 ')
        .replace(/,\s*/g, ',\n  ')
        .replace(/^\n+/, '');
    return [...comments, text].filter(Boolean).join('\n');
}

function highlightSql(sql) {
    const formatted = formatSql(sql);
    const tokenPattern = /('[^']*'|:[A-Za-z_][\w]*|\b[A-Za-z_][\w$#]*\b|\b\d+(?:\.\d+)?\b|[(),.;=*<>+-])/g;
    let html = '';
    let lastIndex = 0;
    for (const match of formatted.matchAll(tokenPattern)) {
        const token = match[0];
        html += escapeHtml(formatted.slice(lastIndex, match.index));
        const upper = token.toUpperCase();
        const safeToken = escapeHtml(token);
        if (token.startsWith("'")) html += `<span class="sql-string">${safeToken}</span>`;
        else if (token.startsWith(':')) html += `<span class="sql-param">${safeToken}</span>`;
        else if (/^\d/.test(token)) html += `<span class="sql-number">${safeToken}</span>`;
        else if (SQL_KEYWORDS.has(upper)) html += `<span class="sql-keyword">${upper}</span>`;
        else if (/^[(),.;=*<>+-]$/.test(token)) html += `<span class="sql-symbol">${safeToken}</span>`;
        else html += `<span class="sql-ident">${safeToken}</span>`;
        lastIndex = match.index + token.length;
    }
    html += escapeHtml(formatted.slice(lastIndex));
    return html;
}

function visibleSql() {
    const include = document.getElementById('includeComments').checked;
    return include ? currentSql || '' : stripSqlComments(currentSql || '');
}

function renderSql() {
    const el = document.getElementById('currentSql');
    const sql = visibleSql();
    if (!sql) {
        el.className = 'sql-code empty';
        el.textContent = 'SQL will appear here.';
        return;
    }
    el.className = 'sql-code';
    el.innerHTML = highlightSql(sql);
}

function addMessage(role, html) {
    const log = document.getElementById('chatLog');
    const row = document.createElement('div');
    row.className = `chat-message ${role}`;
    row.innerHTML = `
        <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
        <div class="bubble">${html}</div>
    `;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
}

function formatDuration(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const seconds = String(totalSeconds % 60).padStart(2, '0');
    return `${minutes}:${seconds}`;
}

function startThinkingTimer() {
    stopThinkingTimer(false);
    thinkingStartedAt = performance.now();
    const timer = document.getElementById('thinkingTimer');
    timer.hidden = false;
    timer.classList.add('active');
    timer.textContent = '00:00';
    renderMatches([]);
    thinkingTimerId = setInterval(() => {
        timer.textContent = formatDuration(performance.now() - thinkingStartedAt);
    }, 1000);
}

function stopThinkingTimer(keepVisible = true) {
    if (thinkingTimerId) {
        clearInterval(thinkingTimerId);
        thinkingTimerId = null;
    }
    const timer = document.getElementById('thinkingTimer');
    if (!timer) return 0;
    const elapsed = thinkingStartedAt ? performance.now() - thinkingStartedAt : 0;
    timer.textContent = formatDuration(elapsed);
    timer.classList.remove('active');
    timer.hidden = !keepVisible;
    thinkingStartedAt = null;
    return elapsed;
}

function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => btn.innerHTML = original, 1600);
    });
}

function copyCurrentSql(btn) {
    copyToClipboard(visibleSql(), btn);
}

function renderMatches(matches) {
    const el = document.getElementById('matchList');
    if (!matches || matches.length === 0) {
        el.innerHTML = `<div class="side-muted">${escapeHtml(t('noCandidate'))}</div>`;
        return;
    }
    el.innerHTML = matches.slice(0, 6).map(m => `
        <div class="match-row">
            <div>${escapeHtml(m.sql_id)}</div>
            <strong>${Math.round((m.llm_score || 0) * 100)}%</strong>
            <small>${escapeHtml(m.reason || '')}</small>
        </div>
    `).join('');
}

function renderRecord(response) {
    currentResponse = response;
    const record = response.record;
    const analysis = record.analysis || {};
    const stmt = record.statement || {};
    const snapshot = record.metadata_snapshot || {};
    const warnings = snapshot.validation_warnings || [];
    const intentPlan = response.intent_plan || snapshot.intent_plan || {};
    const bundles = response.evidence_bundles || snapshot.evidence_bundles || [];
    const validation = response.validation_result || snapshot.validation_result || {};
    const invalidReason = response.invalid_reason || '';
    currentSqlId = stmt.id;
    currentSql = decodeHtmlEntities(stmt.raw_sql || '');

    const meta = document.getElementById('currentSqlMeta');
    meta.dataset.empty = 'false';
    meta.innerText = `${response.mode.toUpperCase()} / ${stmt.id || ''}`;
    const detail = document.getElementById('detailLink');
    if (response.learned || response.mode === 'matched') {
        detail.href = `/sql/${encodeURIComponent(stmt.id)}`;
        detail.classList.remove('disabled-link');
        detail.removeAttribute('aria-disabled');
    } else {
        detail.href = '#';
        detail.classList.add('disabled-link');
        detail.setAttribute('aria-disabled', 'true');
    }
    renderSql();
    renderMatches(response.matches || []);

    const badgeText = response.learned ? 'Learned' : (response.mode || 'draft').toUpperCase();
    const badgeClass = response.learned ? 'badge-green' : (response.mode === 'matched' ? 'badge-blue' : 'badge-green');
    const learnedBadge = `<span class="badge ${badgeClass}">${escapeHtml(badgeText)}</span>`;
    addMessage('assistant', `
        <div class="result-head">
            ${learnedBadge}
            <span>${escapeHtml(response.message)}</span>
        </div>
        <h3>${escapeHtml(analysis.summary || 'SQL')}</h3>
        <p>${escapeHtml((analysis.business_context || []).join(' / '))}</p>
        ${renderEvidenceSummary(intentPlan, bundles, validation, response)}
        ${invalidReason ? `<p class="side-muted">${escapeHtml(invalidReason)}</p>` : ''}
        ${warnings.length ? `<p class="side-muted">${escapeHtml(warnings.join(' / '))}</p>` : ''}
        ${response.learned || response.mode === 'matched' || warnings.length || invalidReason ? '' : `<button class="btn btn-primary icon-btn" onclick="acceptCurrentSql(this)" title="${escapeHtml(t('accept'))}"><i class="fas fa-thumbs-up"></i></button>`}
    `);
}

function renderEvidenceSummary(intentPlan, bundles, validation, response) {
    const intents = (intentPlan.units || []).map(unit => unit.name).filter(Boolean).join(' / ');
    const tableNames = [];
    (bundles || []).forEach(bundle => (bundle.recommended_tables || []).slice(0, 3).forEach(item => {
        if (item.table && !tableNames.includes(item.table)) tableNames.push(item.table);
    }));
    const fields = [];
    (bundles || []).forEach(bundle => (bundle.recommended_fields || []).slice(0, 6).forEach(item => {
        const label = item.table && item.column ? `${item.table}.${item.column}` : item.column;
        if (label && !fields.includes(label)) fields.push(label);
    }));
    const parts = [
        intents ? `Intent: ${intents}` : '',
        tableNames.length ? `Tables: ${tableNames.join(', ')}` : '',
        fields.length ? `Fields: ${fields.join(', ')}` : '',
        response.agent_run_id ? `Run: ${response.agent_run_id}` : '',
        response.llm_call_count ? `LLM: ${response.llm_call_count}` : '',
        response.client_elapsed_ms ? `思考時間: ${formatDuration(response.client_elapsed_ms)}` : ''
    ].filter(Boolean);
    if (!parts.length) return '';
    const validText = validation && validation.valid === false ? 'INVALID' : 'VERIFIED';
    return `<p class="side-muted">${escapeHtml(validText + ' / ' + parts.join(' / '))}</p>`;
}

async function acceptCurrentSql(btn) {
    if (!currentResponse || !currentSql) return;
    const record = currentResponse.record || {};
    const analysis = record.analysis || {};
    const stmt = record.statement || {};
    const product = document.getElementById('productSelect').value;
    const payload = {
        product,
        requirement: lastRequirement || stmt.comment || '',
        sql: currentSql,
        summary: analysis.summary || '',
        business_meaning: (analysis.business_context || []).join(' / '),
        usage_guide: analysis.usage_guide || '',
        parameters: analysis.parameters || [],
        tables: stmt.tables || []
    };
    const res = await fetch('/api/assistant/learn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
        addMessage('assistant', `<span style="color:#dc2626;">${escapeHtml(data.detail || 'learn error')}</span>`);
        return;
    }
    renderRecord({
        product,
        mode: 'learned',
        message: `${t('accept')} / RAG ready for next request`,
        matches: currentResponse.matches || [],
        record: data.record,
        learned: true
    });
}

async function sendMessage(text) {
    lastRequirement = text;
    const product = document.getElementById('productSelect').value;
    addMessage('user', escapeHtml(text));
    startThinkingTimer();
    const pending = addMessage('assistant', `
        <div class="pending-row">
            <i class="fas fa-spinner fa-spin"></i>
            <span>${escapeHtml(t('checking'))}</span>
            <span class="pending-elapsed">00:00</span>
        </div>
    `);
    const pendingTimer = pending.querySelector('.pending-elapsed');
    const pendingInterval = setInterval(() => {
        if (thinkingStartedAt && pendingTimer) {
            pendingTimer.textContent = formatDuration(performance.now() - thinkingStartedAt);
        }
    }, 1000);

    const payload = {
        product,
        message: text,
        session_id: sessionId,
        current_sql_id: currentSqlId,
        current_sql: currentSql,
        top_k: 5,
        match_threshold: 0.78,
        use_aliases: document.getElementById('useAliases').checked
    };

    try {
        const res = await fetch('/api/assistant/sql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        const elapsed = stopThinkingTimer(true);
        clearInterval(pendingInterval);
        pending.remove();
        if (!res.ok) {
            addMessage('assistant', `<span style="color:#dc2626;">${escapeHtml(data.detail || 'エラーが発生しました。')}</span>`);
            return;
        }
        data.client_elapsed_ms = elapsed;
        renderRecord(data);
    } catch (error) {
        const elapsed = stopThinkingTimer(true);
        clearInterval(pendingInterval);
        pending.remove();
        addMessage('assistant', `<span style="color:#dc2626;">${escapeHtml(error.message || 'エラーが発生しました。')} / ${formatDuration(elapsed)}</span>`);
    }
}

document.getElementById('assistantForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    await sendMessage(text);
});

document.getElementById('messageInput').addEventListener('keydown', async (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('assistantForm').requestSubmit();
    }
});

document.getElementById('productSelect').addEventListener('change', () => {
    resetCurrentSql();
});

document.getElementById('includeComments').addEventListener('change', renderSql);

function resetCurrentSql() {
    currentSqlId = null;
    currentSql = null;
    const meta = document.getElementById('currentSqlMeta');
    meta.dataset.empty = 'true';
    meta.innerText = t('noSql');
    document.getElementById('matchList').innerHTML = '';
    const detail = document.getElementById('detailLink');
    detail.href = '#';
    detail.classList.add('disabled-link');
    detail.setAttribute('aria-disabled', 'true');
    renderSql();
}

window.onAnySqlLanguageChange = () => {
    const meta = document.getElementById('currentSqlMeta');
    if (meta && meta.dataset.empty === 'true') meta.innerText = t('noSql');
    const matchList = document.getElementById('matchList');
    if (matchList && !matchList.children.length) renderMatches([]);
};
</script>
{% endblock %}
