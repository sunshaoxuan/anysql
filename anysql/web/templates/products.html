{% extends "layout.html" %}

{% block content %}
<div class="app-container">
    <div class="products-workbench">
        <section class="products-list">
            <div class="products-head">
                <div>
                    <h1 data-i18n="productsTitle">プロダクト</h1>
                    <p data-i18n="productsLead">Metadata、SQLソース、生成ルール</p>
                </div>
                <button class="btn btn-primary icon-btn" onclick="newProduct()" data-i18n-title="newProduct" title="追加">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div id="productCards" class="product-cards"></div>
        </section>

        <section class="product-editor">
            <div class="side-label" data-i18n="productEditor">プロダクト</div>
            <form id="productForm" class="product-form">
                <input type="hidden" name="physical_id">
                <div class="form-grid">
                    <label><span data-i18n="code">コード</span><input name="code" required pattern="[A-Za-z0-9_-]+"></label>
                    <label><span data-i18n="name">名前</span><input name="name" required></label>
                </div>
                <label><span data-i18n="description">説明</span><textarea name="description" rows="2"></textarea></label>
                <label><span data-i18n="rules">ルール / Prompt制約</span><textarea name="rules" rows="8"></textarea></label>
                <div class="form-grid">
                    <label><span data-i18n="sqlDir">SQLディレクトリ</span><input name="sql_dir" required></label>
                    <label><span data-i18n="descDir">分析ディレクトリ</span><input name="desc_dir" required></label>
                    <label><span data-i18n="metadataDir">Metadataディレクトリ</span><input name="metadata_dir" required></label>
                    <label><span data-i18n="dbType">DB種別</span><input name="database_type" value="oracle"></label>
                    <label><span data-i18n="host">ホスト</span><input name="database_host"></label>
                    <label><span data-i18n="port">ポート</span><input name="database_port" type="number" value="1521"></label>
                    <label><span data-i18n="service">サービス</span><input name="database_service_name"></label>
                    <label><span data-i18n="user">ユーザー</span><input name="database_username"></label>
                    <label class="password-field"><span data-i18n="password">パスワード</span>
                        <div class="password-row">
                            <input name="database_password" type="password" autocomplete="off">
                            <button type="button" class="btn btn-outline icon-btn" onclick="togglePassword(this)" data-i18n-title="showPassword" title="表示"><i class="fas fa-eye"></i></button>
                            <button type="button" class="btn btn-outline icon-btn" onclick="copyPassword(this)" data-i18n-title="copyPassword" title="コピー"><i class="far fa-copy"></i></button>
                        </div>
                    </label>
                </div>
                <div class="editor-actions">
                    <button type="submit" class="btn btn-primary icon-btn" data-i18n-title="save" title="保存"><i class="fas fa-floppy-disk"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="syncCurrentProduct(this)" data-i18n-title="syncMetadata" title="Metadata同期"><i class="fas fa-rotate"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="startSqlAnalysis(this)" title="SQL解析"><i class="fas fa-chart-line"></i></button>
                    <button type="button" class="btn btn-outline icon-btn danger-btn" onclick="deleteCurrentProduct()" data-i18n-title="delete" title="削除"><i class="fas fa-trash"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="newProduct()" data-i18n-title="clear" title="クリア"><i class="fas fa-eraser"></i></button>
                </div>
            </form>

            <div class="profile-panel">
                <div class="side-label" data-i18n="tableProfiles">表角色</div>
                <div class="profile-actions">
                    <input id="profileSearch" data-i18n-placeholder="tableProfileSearch" placeholder="テーブル検索">
                    <button type="button" class="btn btn-outline icon-btn" onclick="loadTableProfiles()" data-i18n-title="search" title="検索"><i class="fas fa-magnifying-glass"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="rebuildProfiles(this)" data-i18n-title="rebuildProfiles" title="再構築"><i class="fas fa-layer-group"></i></button>
                </div>
                <div id="tableProfiles" class="profile-list"></div>
            </div>

            <div class="profile-panel">
                <div class="side-label">RAG</div>
                <div class="profile-actions">
                    <button type="button" class="btn btn-outline icon-btn" onclick="loadRagStats()" title="Stats"><i class="fas fa-chart-simple"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="rebuildRag(this)" title="Rebuild RAG"><i class="fas fa-brain"></i></button>
                    <input id="joinSearch" placeholder="JOIN edge">
                    <button type="button" class="btn btn-outline icon-btn" onclick="loadJoinEdges()" title="JOIN"><i class="fas fa-link"></i></button>
                </div>
                <div id="ragStats" class="profile-list"></div>
                <div id="joinEdges" class="profile-list"></div>
            </div>

            <div class="profile-panel">
                <div class="side-label">知識補強</div>
                <div class="profile-actions">
                    <select id="gapStatus">
                        <option value="">all</option>
                        <option value="queued">queued</option>
                        <option value="running">running</option>
                        <option value="proposed">proposed</option>
                        <option value="approved">approved</option>
                        <option value="rejected">rejected</option>
                        <option value="failed">failed</option>
                    </select>
                    <button type="button" class="btn btn-outline icon-btn" onclick="loadKnowledgeGaps()" title="Knowledge gaps"><i class="fas fa-wand-magic-sparkles"></i></button>
                </div>
                <div id="knowledgeGaps" class="profile-list"></div>
            </div>
        </section>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let products = [];
let editingPhysicalId = null;
let tableProfiles = [];
let knowledgeGapPoller = null;

function fillForm(product = {}) {
    const form = document.getElementById('productForm');
    const defaults = {
        physical_id: '',
        code: '',
        name: '',
        description: '',
        rules: '',
        sql_dir: './products/new/sql',
        desc_dir: './products/new/desc',
        metadata_dir: './products/new/metadata',
        database_type: 'oracle',
        database_host: '',
        database_port: 1521,
        database_service_name: '',
        database_username: '',
        database_password: ''
    };
    const data = { ...defaults, ...product };
    for (const [key, value] of Object.entries(data)) {
        const el = form.elements[key];
        if (el) el.value = value ?? '';
    }
    editingPhysicalId = product.physical_id || null;
}

function newProduct() {
    fillForm();
    stopKnowledgeGapPolling();
    document.getElementById('knowledgeGaps').innerHTML = '';
    document.querySelector('[name="code"]').focus();
}

function renderProducts() {
    const list = document.getElementById('productCards');
    list.innerHTML = products.map(p => `
        <button class="product-card" onclick="editProduct('${p.physical_id || p.id}')">
            <span><i class="fas fa-database"></i></span>
            <strong>${escapeHtml(p.name)}</strong>
            <small>${escapeHtml(p.code || p.id)} / ${p.sql_count || 0} SQL</small>
        </button>
    `).join('');
}

function editProduct(physicalId) {
    const p = products.find(item => (item.physical_id || item.id) === physicalId);
    if (!p) return;
    fillForm({
        ...p,
        database_type: p.database_type || 'oracle',
        database_host: p.database_host || '',
        database_port: p.database_port || 1521,
        database_service_name: p.database_service_name || '',
        database_username: p.database_username || '',
        database_password: p.database_password || ''
    });
    loadTableProfiles();
    loadKnowledgeGaps();
}

function stopKnowledgeGapPolling() {
    if (knowledgeGapPoller) {
        clearInterval(knowledgeGapPoller);
        knowledgeGapPoller = null;
    }
}

function togglePassword(btn) {
    const input = document.getElementById('productForm').elements.database_password;
    const icon = btn.querySelector('i');
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    icon.className = visible ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function copyPassword(btn) {
    const input = document.getElementById('productForm').elements.database_password;
    navigator.clipboard.writeText(input.value || '').then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => btn.innerHTML = original, 1200);
    });
}

async function loadProducts() {
    const res = await fetch('/api/products');
    products = await res.json();
    renderProducts();
    if (products[0]) editProduct(products[0].physical_id || products[0].id);
}

document.getElementById('productForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = Object.fromEntries(new FormData(form).entries());
    payload.physical_id = editingPhysicalId || payload.physical_id || null;
    payload.database_port = Number(payload.database_port || 1521);
    const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadProducts();
});

async function deleteCurrentProduct() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    if (!confirm(`Delete product configuration: ${code}?`)) return;
    const res = await fetch(`/api/products/${encodeURIComponent(code)}`, { method: 'DELETE' });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    editingPhysicalId = null;
    await loadProducts();
    if (!products.length) newProduct();
}

async function syncCurrentProduct(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/analysis/${encodeURIComponent(code)}/metadata-sync`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    const result = await res.json();
    alert(`${t('syncMetadata')}: ${result.status}`);
}

async function startSqlAnalysis(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/analysis/${encodeURIComponent(code)}/start?force=true`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    const result = await res.json();
    alert(`SQL: ${result.status || result.message}`);
}

async function loadTableProfiles() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const q = document.getElementById('profileSearch').value || '';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles?q=${encodeURIComponent(q)}&limit=80`);
    if (!res.ok) {
        document.getElementById('tableProfiles').innerHTML = '';
        return;
    }
    tableProfiles = await res.json();
    renderTableProfiles();
}

function renderTableProfiles() {
    const el = document.getElementById('tableProfiles');
    el.innerHTML = tableProfiles.map(p => `
        <div class="profile-row">
            <div>
                <strong>${escapeHtml(p.table_name)}</strong>
                <small>${escapeHtml(p.comment || '')}</small>
                <small>${escapeHtml(p.source)} / ${Math.round((p.confidence || 0) * 100)}% / ${escapeHtml(p.reason || '')}</small>
            </div>
            <select data-table="${escapeHtml(p.table_name)}" data-field="domain">
                ${['unknown','employee','transfer','payroll','organization'].map(v => `<option value="${v}" ${p.domain === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <select data-table="${escapeHtml(p.table_name)}" data-field="role">
                ${['unknown','business_fact','history_fact','master','log','work','if_staging','backup','config'].map(v => `<option value="${v}" ${p.role === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <button type="button" class="btn btn-outline icon-btn" onclick="saveProfile('${escapeHtml(p.table_name)}')" data-i18n-title="save" title="保存"><i class="fas fa-floppy-disk"></i></button>
        </div>
    `).join('');
}

async function saveProfile(tableName) {
    const code = document.getElementById('productForm').elements.code.value;
    const domain = document.querySelector(`[data-table="${CSS.escape(tableName)}"][data-field="domain"]`).value;
    const role = document.querySelector(`[data-table="${CSS.escape(tableName)}"][data-field="role"]`).value;
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles/${encodeURIComponent(tableName)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domain, role })
    });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadTableProfiles();
}

async function rebuildProfiles(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles/rebuild`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadTableProfiles();
}

async function loadRagStats() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/rag/stats`);
    const el = document.getElementById('ragStats');
    if (!res.ok) {
        el.innerHTML = '';
        return;
    }
    const stats = await res.json();
    const nodes = stats.nodes || {};
    el.innerHTML = `<div class="profile-row"><div><strong>${stats.total_nodes || 0} nodes / ${stats.embeddings || 0} vectors</strong><small>${escapeHtml(JSON.stringify(nodes))}</small><small>${escapeHtml(stats.updated_at || '')}</small></div></div>`;
}

async function rebuildRag(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/rag/rebuild`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadRagStats();
}

async function loadJoinEdges() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const q = document.getElementById('joinSearch').value || '';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/join-edges?q=${encodeURIComponent(q)}&limit=40`);
    const el = document.getElementById('joinEdges');
    if (!res.ok) {
        el.innerHTML = '';
        return;
    }
    const rows = await res.json();
    el.innerHTML = rows.map(edge => `<div class="profile-row"><div><strong>${escapeHtml(edge.from_table)}.${escapeHtml(edge.from_column)} -> ${escapeHtml(edge.to_table)}.${escapeHtml(edge.to_column)}</strong><small>${escapeHtml(edge.source)} / ${Math.round((edge.confidence || 0) * 100)}% / ${escapeHtml(edge.reason || '')}</small></div></div>`).join('');
}

async function loadKnowledgeGaps() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const status = document.getElementById('gapStatus').value || '';
    const res = await fetch(`/api/knowledge-gaps?product=${encodeURIComponent(code)}&status=${encodeURIComponent(status)}&limit=40`);
    const el = document.getElementById('knowledgeGaps');
    if (!res.ok) {
        el.innerHTML = '';
        return;
    }
    const rows = await res.json();
    if (!rows.length) {
        el.innerHTML = '<div class="profile-row"><div><small>候補なし</small></div></div>';
        stopKnowledgeGapPolling();
        return;
    }
    const hasActive = rows.some(gap => ['queued', 'running'].includes(gap.status));
    if (hasActive && !knowledgeGapPoller) {
        knowledgeGapPoller = setInterval(loadKnowledgeGaps, 2000);
    } else if (!hasActive) {
        stopKnowledgeGapPolling();
    }
    el.innerHTML = rows.map(gap => `
        <div class="profile-row gap-row">
            <div class="gap-info">
                <strong>${escapeHtml(gap.status)} / ${Math.round((gap.confidence || 0) * 100)}%</strong>
                <small>${escapeHtml(gap.requirement || '')}</small>
                <small>${escapeHtml((gap.trigger_reasons || []).join(' / ') || gap.invalid_reason || '')}</small>
                ${renderGapProgress(gap)}
            </div>
            <div class="gap-actions">
                <button type="button" class="btn btn-outline icon-btn" onclick="approveGap('${gap.id}')" title="Approve" ${gap.status === 'proposed' ? '' : 'disabled'}><i class="fas fa-check"></i></button>
                <button type="button" class="btn btn-outline icon-btn danger-btn" onclick="rejectGap('${gap.id}')" title="Reject" ${['proposed','failed'].includes(gap.status) ? '' : 'disabled'}><i class="fas fa-xmark"></i></button>
                <button type="button" class="btn btn-outline icon-btn" onclick="rerunGap('${gap.id}')" title="Rerun"><i class="fas fa-rotate"></i></button>
            </div>
        </div>
    `).join('');
}

function renderGapProgress(gap) {
    const progress = gap.progress || {};
    const percent = Math.max(0, Math.min(100, Number(progress.percent || 0)));
    const detail = progress.detail || {};
    const tables = Array.isArray(detail.candidate_tables) && detail.candidate_tables.length
        ? `<small>候補表: ${escapeHtml(detail.candidate_tables.slice(0, 8).join(', '))}</small>`
        : '';
    const terms = Array.isArray(detail.terms)
        ? `<small>用語: ${escapeHtml(detail.terms.map(item => item.term || item).slice(0, 6).join(', '))}</small>`
        : '';
    return `
        <div class="gap-progress compact">
            <div class="gap-progress-head">
                <span>${escapeHtml(progress.stage || gap.status)}</span>
                <strong>${Math.round(percent)}%</strong>
            </div>
            <div class="gap-progress-bar"><i style="width:${percent}%"></i></div>
            <small>${escapeHtml(progress.message || JSON.stringify(gap.candidate_summary || {}))}</small>
            ${tables}
            ${terms}
        </div>
    `;
}

async function approveGap(id) {
    const res = await fetch(`/api/knowledge-gaps/${encodeURIComponent(id)}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewed_by: 'system' })
    });
    if (!res.ok) alert(await res.text());
    await loadKnowledgeGaps();
    await loadRagStats();
}

async function rejectGap(id) {
    const res = await fetch(`/api/knowledge-gaps/${encodeURIComponent(id)}/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewed_by: 'system' })
    });
    if (!res.ok) alert(await res.text());
    await loadKnowledgeGaps();
}

async function rerunGap(id) {
    const res = await fetch(`/api/knowledge-gaps/${encodeURIComponent(id)}/rerun`, { method: 'POST' });
    if (!res.ok) alert(await res.text());
    await loadKnowledgeGaps();
}

document.getElementById('profileSearch').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        loadTableProfiles();
    }
});
document.getElementById('gapStatus').addEventListener('change', loadKnowledgeGaps);

loadProducts();
</script>
{% endblock %}
