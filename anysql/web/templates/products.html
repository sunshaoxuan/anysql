{% extends "layout.html" %}

{% block content %}
<div class="app-container">
    <div class="products-workbench">
        <section class="products-list">
            <div class="products-head">
                <div>
                    <h1>Products</h1>
                    <p>Metadata, SQL sources, and model guardrails.</p>
                </div>
                <button class="btn btn-primary icon-btn" onclick="newProduct()" title="New product">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div id="productCards" class="product-cards"></div>
        </section>

        <section class="product-editor">
            <div class="side-label">Product</div>
            <form id="productForm" class="product-form">
                <div class="form-grid">
                    <label>ID<input name="id" required pattern="[A-Za-z0-9_-]+"></label>
                    <label>Name<input name="name" required></label>
                </div>
                <label>Description<textarea name="description" rows="2"></textarea></label>
                <label>Rules / Prompt Guardrails<textarea name="rules" rows="8" placeholder="Undocumented product rules, naming conventions, forbidden joins, date handling, tenant filters..."></textarea></label>
                <div class="form-grid">
                    <label>SQL Dir<input name="sql_dir" required></label>
                    <label>Desc Dir<input name="desc_dir" required></label>
                    <label>Metadata Dir<input name="metadata_dir" required></label>
                    <label>DB Type<input name="database_type" value="oracle"></label>
                    <label>Host<input name="database_host"></label>
                    <label>Port<input name="database_port" type="number" value="1521"></label>
                    <label>Service<input name="database_service_name"></label>
                    <label>User<input name="database_username"></label>
                    <label>Password<input name="database_password" type="password"></label>
                </div>
                <div class="editor-actions">
                    <button type="submit" class="btn btn-primary icon-btn" title="Save"><i class="fas fa-floppy-disk"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="newProduct()" title="Clear"><i class="fas fa-eraser"></i></button>
                </div>
            </form>
        </section>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let products = [];

function fillForm(product = {}) {
    const form = document.getElementById('productForm');
    const defaults = {
        id: '',
        name: '',
        description: '',
        rules: '',
        sql_dir: './products/new/sql',
        desc_dir: './products/new/desc',
        metadata_dir: './products/new/metadata',
        database_type: 'oracle',
        database_host: '',
        database_port: 1521,
        database_service_name: '',
        database_username: '',
        database_password: ''
    };
    const data = { ...defaults, ...product };
    for (const [key, value] of Object.entries(data)) {
        const el = form.elements[key];
        if (el) el.value = value ?? '';
    }
}

function newProduct() {
    fillForm();
    document.querySelector('[name="id"]').focus();
}

function renderProducts() {
    const list = document.getElementById('productCards');
    list.innerHTML = products.map(p => `
        <button class="product-card" onclick="editProduct('${p.id}')">
            <span><i class="fas fa-database"></i></span>
            <strong>${escapeHtml(p.name)}</strong>
            <small>${escapeHtml(p.id)} / ${p.sql_count || 0} SQL</small>
        </button>
    `).join('');
}

function editProduct(id) {
    const p = products.find(item => item.id === id);
    if (!p) return;
    fillForm({
        ...p,
        database_type: p.database_type || 'oracle',
        database_host: p.database_host || '',
        database_port: p.database_port || 1521,
        database_service_name: p.database_service_name || '',
        database_username: p.database_username || ''
    });
}

async function loadProducts() {
    const res = await fetch('/api/products');
    products = await res.json();
    renderProducts();
    if (products[0]) editProduct(products[0].id);
}

document.getElementById('productForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = Object.fromEntries(new FormData(form).entries());
    payload.database_port = Number(payload.database_port || 1521);
    const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadProducts();
});

loadProducts();
</script>
{% endblock %}
