{% extends "layout.html" %}

{% block content %}
<div class="app-container">
    <div class="products-workbench">
        <section class="products-list">
            <div class="products-head">
                <div>
                    <h1 data-i18n="productsTitle">プロダクト</h1>
                    <p data-i18n="productsLead">Metadata、SQLソース、生成ルール</p>
                </div>
                <button class="btn btn-primary icon-btn" onclick="newProduct()" data-i18n-title="newProduct" title="追加">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div id="productCards" class="product-cards"></div>
        </section>

        <section class="product-editor">
            <div class="side-label" data-i18n="productEditor">プロダクト</div>
            <form id="productForm" class="product-form">
                <input type="hidden" name="physical_id">
                <div class="form-grid">
                    <label><span data-i18n="code">コード</span><input name="code" required pattern="[A-Za-z0-9_-]+"></label>
                    <label><span data-i18n="name">名前</span><input name="name" required></label>
                </div>
                <label><span data-i18n="description">説明</span><textarea name="description" rows="2"></textarea></label>
                <label><span data-i18n="rules">ルール / Prompt制約</span><textarea name="rules" rows="8"></textarea></label>
                <div class="form-grid">
                    <label><span data-i18n="sqlDir">SQLディレクトリ</span><input name="sql_dir" required></label>
                    <label><span data-i18n="descDir">分析ディレクトリ</span><input name="desc_dir" required></label>
                    <label><span data-i18n="metadataDir">Metadataディレクトリ</span><input name="metadata_dir" required></label>
                    <label><span data-i18n="dbType">DB種別</span><input name="database_type" value="oracle"></label>
                    <label><span data-i18n="host">ホスト</span><input name="database_host"></label>
                    <label><span data-i18n="port">ポート</span><input name="database_port" type="number" value="1521"></label>
                    <label><span data-i18n="service">サービス</span><input name="database_service_name"></label>
                    <label><span data-i18n="user">ユーザー</span><input name="database_username"></label>
                    <label class="password-field"><span data-i18n="password">パスワード</span>
                        <div class="password-row">
                            <input name="database_password" type="password" autocomplete="off">
                            <button type="button" class="btn btn-outline icon-btn" onclick="togglePassword(this)" data-i18n-title="showPassword" title="表示"><i class="fas fa-eye"></i></button>
                            <button type="button" class="btn btn-outline icon-btn" onclick="copyPassword(this)" data-i18n-title="copyPassword" title="コピー"><i class="far fa-copy"></i></button>
                        </div>
                    </label>
                </div>
                <div class="editor-actions">
                    <button type="submit" class="btn btn-primary icon-btn" data-i18n-title="save" title="保存"><i class="fas fa-floppy-disk"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="syncCurrentProduct(this)" data-i18n-title="syncMetadata" title="Metadata同期"><i class="fas fa-rotate"></i></button>
                    <button type="button" class="btn btn-outline icon-btn danger-btn" onclick="deleteCurrentProduct()" data-i18n-title="delete" title="削除"><i class="fas fa-trash"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="newProduct()" data-i18n-title="clear" title="クリア"><i class="fas fa-eraser"></i></button>
                </div>
            </form>

            <div class="profile-panel">
                <div class="side-label" data-i18n="tableProfiles">表角色</div>
                <div class="profile-actions">
                    <input id="profileSearch" data-i18n-placeholder="tableProfileSearch" placeholder="テーブル検索">
                    <button type="button" class="btn btn-outline icon-btn" onclick="loadTableProfiles()" data-i18n-title="search" title="検索"><i class="fas fa-magnifying-glass"></i></button>
                    <button type="button" class="btn btn-outline icon-btn" onclick="rebuildProfiles(this)" data-i18n-title="rebuildProfiles" title="再構築"><i class="fas fa-layer-group"></i></button>
                </div>
                <div id="tableProfiles" class="profile-list"></div>
            </div>
        </section>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let products = [];
let editingPhysicalId = null;
let tableProfiles = [];

function fillForm(product = {}) {
    const form = document.getElementById('productForm');
    const defaults = {
        physical_id: '',
        code: '',
        name: '',
        description: '',
        rules: '',
        sql_dir: './products/new/sql',
        desc_dir: './products/new/desc',
        metadata_dir: './products/new/metadata',
        database_type: 'oracle',
        database_host: '',
        database_port: 1521,
        database_service_name: '',
        database_username: '',
        database_password: ''
    };
    const data = { ...defaults, ...product };
    for (const [key, value] of Object.entries(data)) {
        const el = form.elements[key];
        if (el) el.value = value ?? '';
    }
    editingPhysicalId = product.physical_id || null;
}

function newProduct() {
    fillForm();
    document.querySelector('[name="code"]').focus();
}

function renderProducts() {
    const list = document.getElementById('productCards');
    list.innerHTML = products.map(p => `
        <button class="product-card" onclick="editProduct('${p.physical_id || p.id}')">
            <span><i class="fas fa-database"></i></span>
            <strong>${escapeHtml(p.name)}</strong>
            <small>${escapeHtml(p.code || p.id)} / ${p.sql_count || 0} SQL</small>
        </button>
    `).join('');
}

function editProduct(physicalId) {
    const p = products.find(item => (item.physical_id || item.id) === physicalId);
    if (!p) return;
    fillForm({
        ...p,
        database_type: p.database_type || 'oracle',
        database_host: p.database_host || '',
        database_port: p.database_port || 1521,
        database_service_name: p.database_service_name || '',
        database_username: p.database_username || '',
        database_password: p.database_password || ''
    });
    loadTableProfiles();
}

function togglePassword(btn) {
    const input = document.getElementById('productForm').elements.database_password;
    const icon = btn.querySelector('i');
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    icon.className = visible ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function copyPassword(btn) {
    const input = document.getElementById('productForm').elements.database_password;
    navigator.clipboard.writeText(input.value || '').then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => btn.innerHTML = original, 1200);
    });
}

async function loadProducts() {
    const res = await fetch('/api/products');
    products = await res.json();
    renderProducts();
    if (products[0]) editProduct(products[0].physical_id || products[0].id);
}

document.getElementById('productForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const payload = Object.fromEntries(new FormData(form).entries());
    payload.physical_id = editingPhysicalId || payload.physical_id || null;
    payload.database_port = Number(payload.database_port || 1521);
    const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadProducts();
});

async function deleteCurrentProduct() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    if (!confirm(`Delete product configuration: ${code}?`)) return;
    const res = await fetch(`/api/products/${encodeURIComponent(code)}`, { method: 'DELETE' });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    editingPhysicalId = null;
    await loadProducts();
    if (!products.length) newProduct();
}

async function syncCurrentProduct(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/analysis/${encodeURIComponent(code)}/metadata-sync`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    const result = await res.json();
    alert(`${t('syncMetadata')}: ${result.status}`);
}

async function loadTableProfiles() {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const q = document.getElementById('profileSearch').value || '';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles?q=${encodeURIComponent(q)}&limit=80`);
    if (!res.ok) {
        document.getElementById('tableProfiles').innerHTML = '';
        return;
    }
    tableProfiles = await res.json();
    renderTableProfiles();
}

function renderTableProfiles() {
    const el = document.getElementById('tableProfiles');
    el.innerHTML = tableProfiles.map(p => `
        <div class="profile-row">
            <div>
                <strong>${escapeHtml(p.table_name)}</strong>
                <small>${escapeHtml(p.comment || '')}</small>
                <small>${escapeHtml(p.source)} / ${Math.round((p.confidence || 0) * 100)}% / ${escapeHtml(p.reason || '')}</small>
            </div>
            <select data-table="${escapeHtml(p.table_name)}" data-field="domain">
                ${['unknown','employee','transfer','payroll','organization'].map(v => `<option value="${v}" ${p.domain === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <select data-table="${escapeHtml(p.table_name)}" data-field="role">
                ${['unknown','business_fact','history_fact','master','log','work','if_staging','backup','config'].map(v => `<option value="${v}" ${p.role === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
            <button type="button" class="btn btn-outline icon-btn" onclick="saveProfile('${escapeHtml(p.table_name)}')" data-i18n-title="save" title="保存"><i class="fas fa-floppy-disk"></i></button>
        </div>
    `).join('');
}

async function saveProfile(tableName) {
    const code = document.getElementById('productForm').elements.code.value;
    const domain = document.querySelector(`[data-table="${CSS.escape(tableName)}"][data-field="domain"]`).value;
    const role = document.querySelector(`[data-table="${CSS.escape(tableName)}"][data-field="role"]`).value;
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles/${encodeURIComponent(tableName)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domain, role })
    });
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadTableProfiles();
}

async function rebuildProfiles(btn) {
    const code = document.getElementById('productForm').elements.code.value;
    if (!code) return;
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    const res = await fetch(`/api/products/${encodeURIComponent(code)}/table-profiles/rebuild`, { method: 'POST' });
    btn.disabled = false;
    btn.innerHTML = original;
    if (!res.ok) {
        alert(await res.text());
        return;
    }
    await loadTableProfiles();
}

document.getElementById('profileSearch').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        loadTableProfiles();
    }
});

loadProducts();
</script>
{% endblock %}
