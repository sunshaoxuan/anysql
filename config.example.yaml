# ============================================================
# AnySQL example configuration
# Copy this file to config.yaml and adjust local values.
# ============================================================

llm:
  base_url: "http://ccnode.briconbric.com:22545"
  chat_model: "qwen3:14b"
  embed_model: "qwen3-embedding:8b"
  timeout: 120
  max_retries: 3
  temperature: 0.3

vector_db:
  # local development: chroma
  # shared service option: chroma_http
  # production target: pgvector, after repository migration is complete
  backend: "chroma"
  persist_dir: "./data/chroma_db"
  collection_prefix: "anysql"
  host:
  port:
  url:

storage:
  backend: "postgresql"
  database_url: "postgresql+psycopg://anysql:change-me@postgres:5432/anysql"

queue:
  backend: "redis"
  redis_url: "redis://redis:6379/0"

server:
  host: "127.0.0.1"
  port: 8765

products:
  demo:
    physical_id: "demo-product"
    name: "Demo Product"
    description: "Example product configuration"
    rules: |
      Write product-specific SQL rules here.
      These rules are always injected into SQL matching, generation, and revision prompts.
    sql_dir: "./products/demo/sql"
    desc_dir: "./products/demo/desc"
    metadata_dir: "./products/demo/metadata"
    database:
      type: "oracle"
      host:
      port: 1521
      service_name:
      username:
      password:

logging:
  level: "INFO"
  dir: "./data/logs"
  rotation: "10 MB"
  retention: "30 days"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level:<8} | {name}:{function}:{line} | {message}"
