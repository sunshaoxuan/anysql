services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anysql
      POSTGRES_USER: anysql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anysql}
    volumes:
      - ./deploy-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anysql -d anysql"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./deploy-data/redis:/data

  api:
    build: .
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anysql}
      ANYSQL_CONFIG: /app/config/config.yaml
      ANYSQL_DATABASE_URL: postgresql+psycopg://anysql:${POSTGRES_PASSWORD:-anysql}@postgres:5432/anysql
      ANYSQL_REDIS_URL: redis://redis:6379/0
      ANYSQL_LLM_BASE_URL: ${ANYSQL_LLM_BASE_URL:-http://ccnode.briconbric.com:22545}
      ANYSQL_CHAT_MODEL: ${ANYSQL_CHAT_MODEL:-qwen3:14b}
      ANYSQL_EMBED_MODEL: ${ANYSQL_EMBED_MODEL:-qwen3-embedding:8b}
      ANYSQL_SERVER_PORT: 8765
      ANYSQL_RUN_MIGRATIONS: "true"
    ports:
      - "${ANYSQL_PORT:-8765}:8765"
    volumes:
      - ./deploy-data/config:/app/config
      - ./deploy-data/imports:/app/storage/imports
      - ./deploy-data/exports:/app/storage/exports
      - ./deploy-data/logs:/app/storage/logs

  worker:
    build: .
    command: ["worker"]
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anysql}
      ANYSQL_CONFIG: /app/config/config.yaml
      ANYSQL_DATABASE_URL: postgresql+psycopg://anysql:${POSTGRES_PASSWORD:-anysql}@postgres:5432/anysql
      ANYSQL_REDIS_URL: redis://redis:6379/0
      ANYSQL_LLM_BASE_URL: ${ANYSQL_LLM_BASE_URL:-http://ccnode.briconbric.com:22545}
      ANYSQL_CHAT_MODEL: ${ANYSQL_CHAT_MODEL:-qwen3:14b}
      ANYSQL_EMBED_MODEL: ${ANYSQL_EMBED_MODEL:-qwen3-embedding:8b}
      ANYSQL_RUN_MIGRATIONS: "false"
    volumes:
      - ./deploy-data/config:/app/config
      - ./deploy-data/imports:/app/storage/imports
      - ./deploy-data/exports:/app/storage/exports
      - ./deploy-data/logs:/app/storage/logs

  scheduler:
    build: .
    command: ["scheduler"]
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anysql}
      ANYSQL_CONFIG: /app/config/config.yaml
      ANYSQL_DATABASE_URL: postgresql+psycopg://anysql:${POSTGRES_PASSWORD:-anysql}@postgres:5432/anysql
      ANYSQL_REDIS_URL: redis://redis:6379/0
      ANYSQL_LLM_BASE_URL: ${ANYSQL_LLM_BASE_URL:-http://ccnode.briconbric.com:22545}
      ANYSQL_CHAT_MODEL: ${ANYSQL_CHAT_MODEL:-qwen3:14b}
      ANYSQL_EMBED_MODEL: ${ANYSQL_EMBED_MODEL:-qwen3-embedding:8b}
      ANYSQL_RUN_MIGRATIONS: "false"
    volumes:
      - ./deploy-data/config:/app/config
      - ./deploy-data/imports:/app/storage/imports
      - ./deploy-data/exports:/app/storage/exports
      - ./deploy-data/logs:/app/storage/logs
